version: '3.9'

services:
  app:
    container_name: keepits-api-app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis://redis:6379
    depends_on:
      - redis
      - mongo
    restart: always
    networks:
      - keepits-api_network
  
  mongo:
    image: mongo:8
    container_name: mongo_container
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: keepits
      MONGO_INITDB_ROOT_PASSWORD: keepits
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - keepits-api_network

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - keepits-api_network

  nginx:
    image: nginx:alpine
    container_name: keepits-api-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always
    networks:
      - keepits-api_network

volumes:
  redis_data:
  mongo_data:

networks:
  keepits-api_network:
    driver: bridge
