
services:
  app:
    container_name: keepits-api-app
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      REDIS_HOST_LOCALHOST: redis://redis-keepits-api:6379
    ports:
      - "${PORT}:9000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis
    restart: always
    networks:
      - keepits-api_network

  redis:
    image: redis:7-alpine
    container_name: redis-keepits-api
    ports:
      - "6379:6379"
    networks:
      - keepits-api_network

volumes:
  redis_data:
  kafka_data:

networks:
  keepits-api_network:
    driver: bridge
